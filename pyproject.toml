[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoi-scheduling"
version = "0.1.0"
readme = "README.md"
description = "Reinforcement learning and exact periodic evaluation for Age of Information scheduling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "gymnasium>=1.0,<2", "networkx>=3,<4", "stable-baselines3==2.9.0", "torch>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
aoi = "aoi.__main__:main"

[tool.setuptools.packages.find]
include = ["aoi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
